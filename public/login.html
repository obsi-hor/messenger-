<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Вход</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #17212b; color: #fff;
    overflow: hidden;
  }
  .wrap {
    display: flex; flex-direction: column;
    padding: 24px; padding-top: 40px;
    height: 100%;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  .tab {
    flex: 1; padding: 10px;
    background: #232e3c; border: 0;
    color: #7d8e9e; font-size: 14px;
    border-radius: 10px; cursor: pointer;
    font-weight: 500;
  }
  .tab.on { background: #6ab2f2; color: #fff; }
  h1 { font-size: 24px; margin: 0 0 8px; text-align: center; }
  .sub { color: #7d8e9e; font-size: 14px; text-align: center; margin-bottom: 32px; }
  label { display: block; font-size: 13px; color: #6ab2f2; margin: 16px 0 6px; }
  input {
    width: 100%; padding: 10px 2px;
    background: transparent; border: 0;
    border-bottom: 1px solid #2f3d4c;
    color: #fff; font-size: 17px; outline: none;
  }
  input:focus { border-bottom-color: #6ab2f2; }
  button.submit {
    width: 100%; padding: 15px; margin-top: 24px;
    background: #6ab2f2; color: #fff; border: 0;
    border-radius: 10px; font-size: 16px; font-weight: 500;
    cursor: pointer;
  }
  .err { color: #e85c5c; font-size: 13px; min-height: 18px; margin-top: 12px; text-align: center; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs">
    <button class="tab on" id="tabLogin" type="button">Вход</button>
    <button class="tab" id="tabReg" type="button">Регистрация</button>
  </div>

  <div id="loginBlock">
    <h1>Вход</h1>
    <div class="sub">Введите логин и пароль</div>
    <label>Логин</label>
    <input id="loginInput" type="text" autocomplete="off" autocapitalize="off">
    <label>Пароль</label>
    <input id="passInput" type="password" autocomplete="off">
    <div class="err" id="loginErr"></div>
    <button class="submit" id="loginBtn" type="button">Войти</button>
  </div>

  <div id="regBlock" class="hidden">
    <h1>Регистрация</h1>
    <div class="sub">Придумайте логин и пароль</div>
    <label>Логин</label>
    <input id="regLogin" type="text" autocomplete="off" autocapitalize="off">
    <label>Имя</label>
    <input id="regName" type="text" autocomplete="off">
    <label>Пароль</label>
    <input id="regPass" type="password" autocomplete="off">
    <div class="err" id="regErr"></div>
    <button class="submit" id="regBtn" type="button">Создать аккаунт</button>
  </div>
</div>

<script>
  var loginBlock = document.getElementById('loginBlock');
  var regBlock = document.getElementById('regBlock');
  var tabLogin = document.getElementById('tabLogin');
  var tabReg = document.getElementById('tabReg');

  tabLogin.onclick = function () {
    loginBlock.classList.remove('hidden');
    regBlock.classList.add('hidden');
    tabLogin.classList.add('on');
    tabReg.classList.remove('on');
  };
  tabReg.onclick = function () {
    regBlock.classList.remove('hidden');
    loginBlock.classList.add('hidden');
    tabReg.classList.add('on');
    tabLogin.classList.remove('on');
  };

  document.getElementById('loginBtn').onclick = function () {
    var login = document.getElementById('loginInput').value.trim().toLowerCase();
    var password = document.getElementById('passInput').value;
    var err = document.getElementById('loginErr');
    err.textContent = '';
    if (!login || !password) { err.textContent = 'Заполните поля'; return; }
    err.textContent = 'Отправка...';
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login: login, password: password })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.ok) { err.textContent = data.error || 'Ошибка'; return; }
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/app.html';
    })
    .catch(function (e) { err.textContent = 'Сеть: ' + e.message; });
  };

  document.getElementById('regBtn').onclick = function () {
    var login = document.getElementById('regLogin').value.trim().toLowerCase();
    var name = document.getElementById('regName').value.trim();
    var password = document.getElementById('regPass').value;
    var err = document.getElementById('regErr');
    err.textContent = '';
    if (!login || !name || !password) { err.textContent = 'Заполните поля'; return; }
    if (password.length < 4) { err.textContent = 'Пароль минимум 4 символа'; return; }
    err.textContent = 'Отправка...';
    fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login: login, name: name, password: password })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.ok) { err.textContent = data.error || 'Ошибка'; return; }
      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/app.html?new=1';
    })
    .catch(function (e) { err.textContent = 'Сеть: ' + e.message; });
  };
</script>
</body>
</html>
