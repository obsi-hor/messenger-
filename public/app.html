<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#17212b">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>Мессенджер</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #17212b; color: #fff;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  #appScreen { flex: 1; display: flex; flex-direction: column; position: relative; }

  /* фон профиля */
  #profileBg {
    position: absolute; inset: 0;
    display: none; z-index: 0;
    background-repeat: repeat;
    background-size: 90px 90px;
    opacity: .18;
    pointer-events: none;
  }
  #profileBg.on { display: block; }

  header {
    height: 56px; padding: 0 8px;
    padding-top: env(safe-area-inset-top);
    background: #17212b; border-bottom: 1px solid #0f171f;
    display: flex; align-items: center;
    position: relative; z-index: 2;
  }
  header h1 { flex: 1; text-align: center; font-size: 18px; font-weight: 500; margin: 0; }
  header button {
    width: 40px; height: 40px;
    background: transparent; border: 0;
    color: #6ab2f2; font-size: 20px;
    cursor: pointer; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  header button.hidden { visibility: hidden; }
  main { flex: 1; overflow-y: auto; position: relative; z-index: 1; }

  nav {
    height: 56px;
    background: #17212b; border-top: 1px solid #0f171f;
    display: flex; padding-bottom: env(safe-area-inset-bottom);
    position: relative; z-index: 2;
  }
  nav button {
    flex: 1; background: transparent; border: 0;
    color: #5a6a7a; font-size: 11px;
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
  }
  nav button.on { color: #6ab2f2; }
  nav button .icon { font-size: 20px; }

  .empty { text-align: center; padding: 60px 24px; color: #5a6a7a; }
  .empty .icon { font-size: 48px; opacity: .3; margin-bottom: 12px; }
  .empty h2 { font-size: 17px; color: #7d8e9e; margin: 0 0 6px; }
  .empty p { font-size: 14px; margin: 0; }

  .creator-check {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px;
    background: #6ab2f2; color: #fff;
    border-radius: 50%; font-size: 10px;
    margin-left: 4px; cursor: pointer;
    vertical-align: middle;
    flex-shrink: 0;
  }
  .nft-badge {
    display: inline-block;
    width: 22px; height: 22px;
    border-radius: 6px;
    background-size: cover; background-position: center;
    margin-left: 6px; vertical-align: middle;
    border: 1px solid rgba(255,255,255,.15);
  }

  /* чаты */
  .chat-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; min-height: 72px; cursor: pointer;
  }
  .chat-item:hover { background: #232e3c; }
  .chat-avatar {
    width: 54px; height: 54px; border-radius: 50%;
    background: linear-gradient(135deg, #6ab2f2, #4a8ec2);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 500; flex-shrink: 0; text-transform: uppercase;
    background-size: cover; background-position: center;
  }
  .chat-body { flex: 1; min-width: 0; }
  .chat-title { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display:flex; align-items:center; }
  .chat-last { font-size: 14px; color: #7d8e9e; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* контакты */
  .contact-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; min-height: 64px;
  }
  .contact-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, #6ab2f2, #4a8ec2);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 500; flex-shrink: 0; text-transform: uppercase;
    background-size: cover; background-position: center;
  }
  .contact-body { flex: 1; min-width: 0; }
  .contact-name { font-size: 15px; font-weight: 500; display:flex; align-items:center; }
  .contact-username { font-size: 13px; color: #7d8e9e; margin-top: 2px; }

  /* профиль */
  .profile-top {
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 20px;
  }
  .profile-avatar {
    width: 110px; height: 110px; border-radius: 50%;
    background: linear-gradient(135deg, #6ab2f2, #4a8ec2);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 42px; font-weight: 500; text-transform: uppercase;
    background-size: cover; background-position: center;
    cursor: pointer; position: relative; margin-bottom: 14px;
  }
  .profile-avatar .cam {
    position: absolute; right: -4px; bottom: -4px;
    width: 34px; height: 34px; border-radius: 50%;
    background: #6ab2f2; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; border: 3px solid #17212b;
  }
  .profile-name { font-size: 22px; font-weight: 500; margin-bottom: 4px; display:flex; align-items:center; }
  .profile-username { font-size: 15px; color: #6ab2f2; margin-bottom: 4px; }
  .profile-id { font-size: 13px; color: #5a6a7a; }
  .profile-actions { display: flex; gap: 8px; padding: 0 12px; margin-bottom: 16px; }
  .profile-action {
    flex: 1; background: #232e3c; border-radius: 12px;
    padding: 12px 8px;
    display: flex; flex-direction: column;
    align-items: center; gap: 6px; cursor: pointer;
  }
  .profile-action .ico { font-size: 22px; color: #6ab2f2; }
  .profile-action .lbl { font-size: 12px; color: #fff; }
  .profile-info { background: #232e3c; border-radius: 14px; margin: 0 12px 12px; overflow: hidden; }
  .profile-info-row { padding: 12px 16px; border-bottom: 1px solid #2f3d4c; }
  .profile-info-row:last-child { border-bottom: 0; }
  .profile-info-row .val { font-size: 16px; word-wrap: break-word; }
  .profile-info-row .lbl { font-size: 13px; color: #7d8e9e; margin-top: 3px; }

  /* вкладки профиля */
  .profile-tabs { display: flex; gap: 4px; margin: 0 12px 12px; }
  .profile-tab {
    flex: 1; padding: 10px;
    background: #232e3c; border: 0;
    color: #7d8e9e; font-size: 13px;
    border-radius: 10px; cursor: pointer; font-weight: 500;
  }
  .profile-tab.on { background: #6ab2f2; color: #fff; }
  .profile-tab-content { padding: 0 12px; }

  /* сетка подарков */
  .gift-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .gift-card {
    background: linear-gradient(135deg, #232e3c, #2a3a5c);
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .gift-card.nft {
    background-size: cover;
    background-position: center;
    min-height: 140px;
    display: flex; flex-direction: column;
    justify-content: flex-end;
  }
  .gift-card .num {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,.5);
    color: #fff; font-size: 11px;
    padding: 2px 8px; border-radius: 10px;
  }
  .gift-card .gift-emoji { font-size: 44px; margin-bottom: 6px; }
  .gift-card .gift-name { font-size: 13px; font-weight: 500; }
  .gift-card .gift-price { font-size: 13px; color: #6ab2f2; margin-top: 4px; }
  .gift-card .gift-owner {
    font-size: 11px; color: #8b95a7; margin-top: 4px;
    background: rgba(0,0,0,.4);
    padding: 3px 6px; border-radius: 6px;
  }

  /* настройки */
  .settings-row {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px; min-height: 56px;
    cursor: pointer;
    border-bottom: 1px solid #0f171f;
  }
  .settings-row:hover { background: #232e3c; }
  .settings-row .row-icon { width: 24px; text-align: center; font-size: 18px; color: #6ab2f2; }
  .settings-row .row-body { flex: 1; min-width: 0; }
  .settings-row .row-title { font-size: 15px; }
  .settings-row .row-value { font-size: 13px; color: #7d8e9e; margin-top: 2px; }
  .settings-row .row-arrow { color: #3a4a5a; font-size: 16px; }
  .settings-row.danger .row-title { color: #e85c5c; }
  .settings-row.danger .row-icon { color: #e85c5c; }

  /* комната */
  #roomScreen {
    position: fixed; inset: 0;
    background: #0e1621;
    display: none; flex-direction: column; z-index: 20;
  }
  #roomScreen.on { display: flex; }
  .room-header {
    height: 56px; padding: 0 8px;
    padding-top: env(safe-area-inset-top);
    background: #17212b; border-bottom: 1px solid #0f171f;
    display: flex; align-items: center; gap: 8px;
  }
  .room-header button {
    width: 40px; height: 40px;
    background: transparent; border: 0;
    color: #6ab2f2; font-size: 20px; cursor: pointer;
  }
  .room-header h2 { font-size: 16px; margin: 0; flex: 1; }
  #roomMessages {
    flex: 1; overflow-y: auto; padding: 12px 8px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .msg {
    max-width: 78%; padding: 8px 12px;
    border-radius: 12px; background: #182533;
    font-size: 15px; word-wrap: break-word;
    align-self: flex-start;
  }
  .msg.own { background: #2b5278; align-self: flex-end; }
  .msg .meta { font-size: 11px; opacity: .6; margin-top: 4px; }

  /* NFT-карточка в чате */
  .nft-card {
    max-width: 85%;
    border-radius: 16px;
    overflow: hidden;
    align-self: flex-start;
    margin-bottom: 4px;
    position: relative;
    padding: 16px 12px 12px;
    text-align: center;
    color: #fff;
    background-size: cover;
    background-position: center;
    min-height: 200px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    border: 1px solid rgba(255,255,255,.15);
  }
  .nft-card.own { align-self: flex-end; }
  .nft-card .nft-num {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,.55);
    padding: 3px 10px; border-radius: 12px;
    font-size: 12px;
  }
  .nft-card .nft-label {
    position: absolute; top: 10px; right: 10px;
    background: rgba(138, 82, 255, .8);
    padding: 3px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 500;
  }
  .nft-card .nft-img {
    width: 100px; height: 100px;
    margin: 20px auto 8px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.5));
  }
  .nft-card .nft-from {
    font-size: 13px; color: #ddd;
    background: rgba(0,0,0,.4);
    padding: 6px 12px; border-radius: 10px;
    margin-top: 8px;
  }
  .nft-card .nft-view-btn {
    background: rgba(255,255,255,.2);
    color: #fff; border: 0;
    padding: 8px 20px; border-radius: 16px;
    font-size: 13px; cursor: pointer;
    margin-top: 10px;
  }

  .room-input {
    padding: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom));
    background: #17212b; border-top: 1px solid #0f171f;
    display: flex; gap: 8px;
  }
  .room-input input {
    flex: 1; background: #232e3c; border: 0;
    color: #fff; padding: 11px 16px;
    border-radius: 20px; font-size: 15px; outline: none;
  }
  .room-input button {
    width: 44px; height: 44px;
    background: #6ab2f2; color: #fff; border: 0;
    border-radius: 50%; font-size: 18px; cursor: pointer;
    flex-shrink: 0;
  }
  .room-input #giftBtn { background: #232e3c; color: #6ab2f2; font-size: 20px; }

  /* модалки */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.75);
    display: none; align-items: center; justify-content: center;
    padding: 24px; z-index: 30;
  }
  .modal.on { display: flex; }
  .modal-body {
    background: #17212b; border-radius: 16px; padding: 20px;
    width: 100%; max-width: 380px;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-body h3 { margin: 0 0 16px; font-size: 18px; text-align: center; }
  .modal-body p { margin: 0 0 16px; font-size: 14px; color: #7d8e9e; text-align: center; line-height: 1.4; }
  .modal-body input {
    width: 100%; background: #232e3c; border: 0;
    color: #fff; padding: 12px 16px; border-radius: 10px;
    font-size: 15px; outline: none;
  }
  .modal-body .err { color: #e85c5c; font-size: 13px; text-align: center; margin-top: 8px; min-height: 16px; }
  .modal-body .close {
    width: 100%; padding: 12px; margin-top: 8px;
    background: transparent; color: #6ab2f2;
    border: 0; border-radius: 10px; font-size: 15px; cursor: pointer;
  }
  .modal-body .save {
    width: 100%; padding: 12px; margin-top: 12px;
    background: #6ab2f2; color: #fff; border: 0;
    border-radius: 10px; font-size: 15px; cursor: pointer;
  }
  .modal-body .danger-btn {
    width: 100%; padding: 12px; margin-top: 12px;
    background: #e85c5c; color: #fff; border: 0;
    border-radius: 10px; font-size: 15px; cursor: pointer;
  }

  /* каталог NFT / подарков */
  .shop-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; padding: 4px 0;
  }
  .shop-card {
    background: linear-gradient(135deg, #232e3c, #2a3a5c);
    border-radius: 14px;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    min-height: 150px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    background-size: cover;
    background-position: center;
    border: 1px solid rgba(255,255,255,.08);
  }
  .shop-card .shop-img {
    width: 90px; height: 90px;
    margin: 6px auto;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.4));
  }
  .shop-card .shop-emoji { font-size: 48px; }
  .shop-card .shop-name { font-size: 14px; font-weight: 500; }
  .shop-card .shop-price { font-size: 14px; color: #6ab2f2; margin-top: 4px; }
</style>
</head>
<body>

<div id="appScreen">
  <div id="profileBg"></div>
  <header>
    <button id="searchBtn">🔍</button>
    <h1 id="title">Чаты</h1>
    <button id="createBtn">✏️</button>
  </header>
  <main id="main"></main>
  <nav>
    <button class="on" data-tab="chats"><span class="icon">💬</span>Чаты</button>
    <button data-tab="contacts"><span class="icon">👥</span>Контакты</button>
    <button data-tab="settings"><span class="icon">⚙️</span>Настройки</button>
    <button data-tab="profile"><span class="icon">👤</span>Профиль</button>
  </nav>
</div>

<div id="roomScreen">
  <div class="room-header">
    <button id="roomBack">←</button>
    <h2 id="roomTitle">Чат</h2>
  </div>
  <div id="roomMessages"></div>
  <div class="room-input">
    <input id="roomInput" placeholder="Сообщение" autocomplete="off">
    <button id="giftBtn">🎁</button>
    <button id="roomSend">➤</button>
  </div>
</div>

<div class="modal" id="searchModal">
  <div class="modal-body">
    <h3>Найти пользователя</h3>
    <input id="searchInput" placeholder="юзернейм" autocomplete="off">
    <div id="searchResults"></div>
    <button class="close" id="searchClose">Закрыть</button>
  </div>
</div>

<div class="modal" id="editNameModal">
  <div class="modal-body">
    <h3>Изменить имя</h3>
    <input id="editNameInput" placeholder="Ваше имя" maxlength="64">
    <div class="err" id="editNameErr"></div>
    <button class="save" id="editNameSave">Сохранить</button>
    <button class="close" id="editNameClose">Отмена</button>
  </div>
</div>

<div class="modal" id="editUsernameModal">
  <div class="modal-body">
    <h3>Юзернейм</h3>
    <input id="editUsernameInput" placeholder="ivan_ivanov" maxlength="16">
    <div class="err" id="editUsernameErr"></div>
    <button class="save" id="editUsernameSave">Сохранить</button>
    <button class="close" id="editUsernameClose">Отмена</button>
  </div>
</div>

<div class="modal" id="addContactModal">
  <div class="modal-body">
    <h3>Добавить контакт</h3>
    <input id="addContactInput" placeholder="юзернейм" autocomplete="off">
    <div class="err" id="addContactErr"></div>
    <button class="save" id="addContactBtn">Добавить</button>
    <button class="close" id="addContactClose">Отмена</button>
  </div>
</div>

<div class="modal" id="creatorModal">
  <div class="modal-body" style="text-align:center">
    <div style="font-size:64px;margin-bottom:12px">✅</div>
    <h3>Оригинальный профиль</h3>
    <p>Этот аккаунт — <b style="color:#6ab2f2">оригинальный профиль создателя этого приложения</b>.</p>
    <button class="close" id="creatorClose">Понятно</button>
  </div>
</div>

<div class="modal" id="shopModal">
  <div class="modal-body">
    <h3 id="shopTitle">Магазин</h3>
    <div class="shop-grid" id="shopGrid"></div>
    <button class="close" id="shopClose">Закрыть</button>
  </div>
</div>

<div class="modal" id="nftActionModal">
  <div class="modal-body" style="text-align:center">
    <div id="nftActionImg" style="width:140px;height:140px;margin:0 auto 12px;background-size:contain;background-repeat:no-repeat;background-position:center"></div>
    <h3 id="nftActionTitle">NFT</h3>
    <p id="nftActionDesc">Что сделать?</p>
    <button class="save" id="nftActionProfile">Добавить в профиль</button>
    <button class="save" id="nftActionGift" style="background:#4a7ee8">Подарить другу</button>
    <button class="danger-btn" id="nftActionSell">Продать</button>
    <button class="close" id="nftActionClose">Отмена</button>
  </div>
</div>

<input type="file" id="avatarInput" accept="image/*" style="display:none">
<script>
var token = localStorage.getItem('token');
if (!token) { window.location.href = '/login.html'; }

var user = {};
try { user = JSON.parse(localStorage.getItem('user') || '{}'); } catch(e) { user = {}; }

var $ = function(id) { return document.getElementById(id); };
var main = $('main');
var title = $('title');
var currentTab = 'chats';
var currentRoom = null;
var ws = null;
var profileNftType = user.profileNftType || null;

var NFT_INFO = {
  rose:  { name: 'Роза',  price: 1500, img: '/nft/nft-rose.png'  },
  orb:   { name: 'Шар',   price: 1000, img: '/nft/nft-orb.png'   },
  slime: { name: 'Слизь', price: 2000, img: '/nft/nft-slime.png' }
};
var GIFTS_ORD = {
  pistol: { name: 'Пистолетик',       price: 25, emoji: '🔫' },
  car:    { name: 'Машина',           price: 50, emoji: '🚗' },
  heart:  { name: 'Сердечко',         price: 15, emoji: '❤️' },
  bday:   { name: 'С днём рождения',  price: 20, emoji: '🎂' }
};

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}
function creatorBadge(isCreator) {
  if (!isCreator) return '';
  return '<span class="creator-check" onclick="event.stopPropagation();document.getElementById(\'creatorModal\').classList.add(\'on\')">✓</span>';
}
function profileNftBadge() {
  if (!profileNftType || !NFT_INFO[profileNftType]) return '';
  var info = NFT_INFO[profileNftType];
  return '<span class="nft-badge" style="background-image:url(' + info.img + ')" title="' + info.name + '"></span>';
}
function findNftById(nftId) {
  var list = user.nfts || [];
  for (var i = 0; i < list.length; i++) if (list[i].id === nftId) return list[i];
  return null;
}

// ===== WEBSOCKET =====
function connectWS() {
  var proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/?token=' + token);
  ws.onclose = function() { setTimeout(connectWS, 2000); };
  ws.onmessage = function(e) {
    var data = JSON.parse(e.data);
    if (data.type === 'message') {
      if (currentRoom && data.chatId === currentRoom.id) {
        addMessage(data.message);
        $('roomMessages').scrollTop = $('roomMessages').scrollHeight;
      }
      if (currentTab === 'chats') renderChats();
    }
  };
}
connectWS();

// ===== ВКЛАДКИ =====
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('nav button').forEach(function(b) {
    b.classList.toggle('on', b.getAttribute('data-tab') === tab);
  });
  var bg = $('profileBg');
  if (tab === 'profile' && profileNftType) {
    bg.style.backgroundImage = 'url(' + NFT_INFO[profileNftType].img + ')';

  if (tab === 'chats') {
    title.textContent = 'Чаты';
    $('searchBtn').classList.remove('hidden');
    $('createBtn').classList.add('hidden');
    renderChats();

    title.textContent = 'Контакты';
    $('searchBtn').classList.add('hidden');
    $('createBtn').classList.remove('hidden');
    renderContacts();

    title.textContent = 'Настройки';
    $('searchBtn').classList.add('hidden');

  } else if (tab === 'profile') {

function renderChats() {
  main.innerHTML = '<div class="empty"><h2>Загрузка...</h2></div>';
  fetch('/api/chats', { headers: { 'Authorization': 'Bearer ' + token } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.chats || !data.chats.length) {
        main.innerHTML = '<div class="empty"><div class="icon">💬</div><h2>Пока пусто</h2><p>Найди друга через поиск 🔍</p></div>';
        return;
      }
      main.innerHTML = '';
      data.chats.forEach(function(c) {
        var name = (c.other && (c.other.name || c.other.username)) || 'Чат';
        var initial = name.charAt(0).toUpperCase();
        var last = (c.last && c.last.text) || 'Нет сообщений';
        var check = creatorBadge(c.other && c.other.isCreator);
        var el = document.createElement('div');
        el.className = 'chat-item';
        el.innerHTML = '<div class="chat-avatar">' + initial + '</div>' +
          '<div class="chat-body"><div class="chat-title">' + escapeHtml(name) + check + '</div>' +
          '<div class="chat-last">' + escapeHtml(last) + '</div></div>';
        el.onclick = function(e) {
          if (e.target.classList.contains('creator-check')) return;
          openRoom(c.id, name, c.other);
        };
        main.appendChild(el);
      });
    })
    .catch(function(e) { main.innerHTML = '<div class="empty"><h2>Ошибка</h2><p>' + escapeHtml(e.message) + '</p></div>'; });
}

// ===== NFT ДЕЙСТВИЯ =====
var currentNftId = null;

function openNftAction(nftId) {
  var nft = findNftById(nftId);
  if (!nft) return;
  currentNftId = nftId;
  var info = NFT_INFO[nft.type] || {};
  $('nftActionImg').style.backgroundImage = 'url(' + info.img + ')';
  $('nftActionTitle').textContent = info.name + ' #' + nft.number;
  $('nftActionDesc').textContent = 'Что сделать с NFT?';
  var isOnProfile = user.profileNft === nftId;
  $('nftActionProfile').textContent = isOnProfile ? '✓ Убрать из профиля' : 'Добавить в профиль';
  $('nftActionModal').classList.add('on');
}
$('nftActionClose').onclick = function() { $('nftActionModal').classList.remove('on'); };

$('nftActionProfile').onclick = function() {
  if (!currentNftId) return;
  var isOn = user.profileNft === currentNftId;
  var newId = isOn ? null : currentNftId;
  fetch('/api/nft/profile', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ nftId: newId })
  })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.ok) { alert(d.error || 'Ошибка'); return; }
      user.profileNft = newId;
      var nft = findNftById(currentNftId);
      user.profileNftType = newId && nft ? nft.type : null;
      localStorage.setItem('user', JSON.stringify(user));
      profileNftType = user.profileNftType;
      $('nftActionModal').classList.remove('on');
      renderProfile();
    });
};

$('nftActionGift').onclick = function() {
  if (!currentNftId) return;
  var to = prompt('Введите @юзернейм получателя');
  if (!to) return;
  fetch('/api/search?q=' + encodeURIComponent(to.toLowerCase().trim()), {
    headers: { 'Authorization': 'Bearer ' + token }
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.users || !data.users.length) { alert('Не найдено'); return; }
      var u = data.users[0];
      fetch('/api/nft/give', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ toUserId: u.id, nftId: currentNftId })
      })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (!d.ok) { alert(d.error || 'Ошибка'); return; }
          user.nfts = (user.nfts || []).filter(function(n) { return n.id !== currentNftId; });
          if (user.profileNft === currentNftId) {
            user.profileNft = null;
            user.profileNftType = null;
            profileNftType = null;
          }
          localStorage.setItem('user', JSON.stringify(user));
          $('nftActionModal').classList.remove('on');
          alert('Подарок передан @' + u.username);
          renderProfile();
        });
    });
};

$('nftActionSell').onclick = function() {
  if (!currentNftId) return;
  var nft = findNftById(currentNftId);
  var info = NFT_INFO[nft.type] || {};
  var commission = Math.ceil(info.price * 0.05);
  var payout = info.price - commission;
  if (!confirm('Продать ' + info.name + ' #' + nft.number + '?\nПолучите: ' + payout + ' 🔮 (комиссия ' + commission + ' 🔮)')) return;
  fetch('/api/nft/sell', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ nftId: currentNftId })
  })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.ok) { alert(d.error || 'Ошибка'); return; }
      user.nfts = (user.nfts || []).filter(function(n) { return n.id !== currentNftId; });
      user.oxy = d.balance;
      if (user.profileNft === currentNftId) {
        user.profileNft = null;
        user.profileNftType = null;
        profileNftType = null;
      }
      localStorage.setItem('user', JSON.stringify(user));
      $('nftActionModal').classList.remove('on');
      alert('Продано! +' + d.payout + ' 🔮');
      renderProfile();
    });
};

// ===== ОБЫЧНЫЕ ПОДАРКИ: ПРОДАЖА =====
function sellOrdinaryGift(index) {
  if (!confirm('Продать подарок? Комиссия 5%.')) return;
  fetch('/api/gift/sell', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ index: index })
  })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.ok) { alert(d.error || 'Ошибка'); return; }
      user.gifts.splice(index, 1);
      user.oxy = d.balance;
      localStorage.setItem('user', JSON.stringify(user));
      alert('Продано! +' + d.payout + ' 🔮');
      renderProfileTabContent();
    });
}

// ===== КОМНАТА =====
function openRoom(chatId, name, other) {
  currentRoom = { id: chatId, name: name, other: other };
  $('roomTitle').textContent = name;
  $('roomMessages').innerHTML = '<div style="color:#5a6a7a;text-align:center;padding:12px">Загрузка...</div>';
  $('roomScreen').classList.add('on');
  fetch('/api/messages?chatId=' + chatId, {
    headers: { 'Authorization': 'Bearer ' + token }
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      $('roomMessages').innerHTML = '';
      if (data.messages) data.messages.forEach(addMessage);
      $('roomMessages').scrollTop = $('roomMessages').scrollHeight;
    })
    .catch(function() {
      $('roomMessages').innerHTML = '<div style="color:#e85c5c;text-align:center;padding:12px">Ошибка загрузки</div>';
    });
}

function addMessage(m) {
  // NFT-карточка
  if (m.nft) {
    var info = NFT_INFO[m.nft.type] || {};
    var own = m.from_user === user.id;
    var div = document.createElement('div');
    div.className = 'nft-card' + (own ? ' own' : '');
    div.style.backgroundImage = 'url(' + info.img + ')';
    var fromName = own ? 'вас' : (currentRoom && currentRoom.other ? currentRoom.other.name || 'собеседник' : 'собеседник');
    div.innerHTML =
      '<div class="nft-num">#' + (m.nft.number || '?') + '</div>' +
      '<div class="nft-label">подарок</div>' +
      '<div class="nft-img" style="background-image:url(' + info.img + ')"></div>' +
      '<div class="nft-from">Подарок от ' + escapeHtml(fromName) + '</div>' +
      '<button class="nft-view-btn">Посмотреть</button>';
    div.querySelector('.nft-view-btn').onclick = function() {
      if (currentRoom && currentRoom.other) alert('Профиль ' + (currentRoom.other.name || ''));
    };
    $('roomMessages').appendChild(div);
    return;
  }
  // обычное сообщение
  var own2 = m.from_user === user.id;
  var div2 = document.createElement('div');
  div2.className = 'msg' + (own2 ? ' own' : '');
  div2.innerHTML = escapeHtml(m.text || '') + '<div class="meta">' + fmtTime(m.created_at) + '</div>';
  $('roomMessages').appendChild(div2);
}

$('roomBack').onclick = function() {
  $('roomScreen').classList.remove('on');
  currentRoom = null;
  if (currentTab === 'chats') renderChats();
};

$('roomSend').onclick = function() {
  var text = $('roomInput').value.trim();
  if (!text || !currentRoom) return;
  if (!ws || ws.readyState !== 1) { alert('Нет соединения'); return; }
  ws.send(JSON.stringify({ type: 'send', chatId: currentRoom.id, text: text }));
  $('roomInput').value = '';
};

$('roomInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') $('roomSend').click();
});

// кнопка подарка в чате
$('giftBtn').onclick = function() {
  if (!currentRoom) return;
  openGiftChat();
};

function openGiftChat() {
  $('shopTitle').textContent = 'Подарок для ' + (currentRoom.other ? (currentRoom.other.name || '') : '');
  var grid = $('shopGrid');
  grid.innerHTML = '';

  // NFT подарки
  Object.keys(NFT_INFO).forEach(function(type) {
    var info = NFT_INFO[type];
    var hasNft = (user.nfts || []).some(function(n) { return n.type === type; });
    var card = document.createElement('div');
    card.className = 'shop-card';
    card.style.opacity = hasNft ? '1' : '0.5';
    card.innerHTML = '<div class="shop-img" style="background-image:url(' + info.img + ')"></div>' +
      '<div class="shop-name">' + info.name + '</div>' +
      '<div class="shop-price">' + (hasNft ? 'Подарить' : 'Нет NFT') + '</div>';
    card.onclick = function() {
      if (!hasNft) { alert('Сначала купи эту NFT в магазине'); return; }
      giveNftToFriend(type);
    };
    grid.appendChild(card);
  });

  // обычные подарки
  Object.keys(GIFTS_ORD).forEach(function(gid) {
    var info = GIFTS_ORD[gid];
    var card = document.createElement('div');
    card.className = 'shop-card';
    card.innerHTML = '<div class="shop-emoji">' + info.emoji + '</div>' +
      '<div class="shop-name">' + info.name + '</div>' +
      '<div class="shop-price">' + info.price + ' 🔮</div>';
    card.onclick = function() { sendOrdinaryGift(gid, info.price, info.name); };
    grid.appendChild(card);
  });

  $('shopModal').classList.add('on');
}

function giveNftToFriend(type) {
  var nft = (user.nfts || []).find(function(n) { return n.type === type; });
  if (!nft) { alert('Нет NFT'); return; }
  if (!confirm('Подарить ' + NFT_INFO[type].name + '? Оно уйдёт у вас.')) return;
  fetch('/api/nft/give', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ toUserId: currentRoom.other.id, nftId: nft.id })
  })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.ok) { alert(d.error || 'Ошибка'); return; }
      user.nfts = user.nfts.filter(function(n) { return n.id !== nft.id; });
      if (user.profileNft === nft.id) { user.profileNft = null; user.profileNftType = null; profileNftType = null; }
      localStorage.setItem('user', JSON.stringify(user));
      ws.send(JSON.stringify({
        type: 'send',
        chatId: currentRoom.id,
        text: '',
        nft: { type: nft.type, number: nft.number }
      }));
      $('shopModal').classList.remove('on');
      alert('NFT подарен!');
    });
}

function sendOrdinaryGift(gid, price, name) {
  if ((user.oxy || 0) < price) { alert('Недостаточно Окси'); return; }
  if (!confirm('Отправить ' + name + ' за ' + price + ' 🔮?')) return;
  fetch('/api/gift', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ toUserId: currentRoom.other.id, giftId: gid, price: price })
  })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.ok) { alert(d.error || 'Ошибка'); return; }
      user.oxy = (user.oxy || 0) - price;
      localStorage.setItem('user', JSON.stringify(user));
      ws.send(JSON.stringify({
        type: 'send',
        chatId: currentRoom.id,
        text: '🎁 Подарок: ' + name + ' (' + price + ' 🔮)'
      }));
      $('shopModal').classList.remove('on');
      alert('Отправлено!');
    });
}

// ===== ПОИСК =====
$('searchBtn').onclick = function() {
  $('searchModal').classList.add('on');
  $('searchInput').value = '';
  $('searchResults').innerHTML = '';
  $('searchInput').focus();
};
$('searchClose').onclick = function() { $('searchModal').classList.remove('on'); };

$('searchInput').addEventListener('input', function() {
  var q = $('searchInput').value.trim().toLowerCase();
  var results = $('searchResults');
  if (!q) { results.innerHTML = ''; return; }
  fetch('/api/search?q=' + encodeURIComponent(q), {
    headers: { 'Authorization': 'Bearer ' + token }
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      results.innerHTML = '';
      if (!data.users || !data.users.length) {
        results.innerHTML = '<div style="color:#5a6a7a;font-size:13px;text-align:center;margin-top:12px">Никого не найдено</div>';
        return;
      }
      data.users.forEach(function(u) {
        var check = creatorBadge(u.isCreator);
        var el = document.createElement('div');
        el.className = 'search-result';
        el.innerHTML = '<div style="flex:1"><div class="n">' + escapeHtml(u.name || 'Без имени') + check + '</div>' +
          '<div class="u">@' + escapeHtml(u.username || '') + '</div></div>' +
          '<button>Написать</button>';
        el.querySelector('button').onclick = function() {
          fetch('/api/chats/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ userId: u.id })
          })
            .then(function(r) { return r.json(); })
            .then(function(rd) {
              if (!rd.ok) { alert(rd.error || 'Ошибка'); return; }
              $('searchModal').classList.remove('on');
              if (currentTab !== 'chats') setTab('chats');
              openRoom(rd.chatId, u.name || u.username, u);
            });
        };
        results.appendChild(el);
      });
    });
});

// ===== РЕДАКТИРОВАНИЯ =====
function openEditName() {
  $('editNameInput').value = user.name || '';
  $('editNameErr').textContent = '';
  $('editNameModal').classList.add('on');
  $('editNameInput').focus();
}
$('editNameClose').onclick = function() { $('editNameModal').classList.remove('on'); };
$('editNameSave').onclick = function() {
  var name = $('editNameInput').value.trim();
  if (!name) { $('editNameErr').textContent = 'Введите имя'; return; }
  fetch('/api/profile', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ name: name })
  })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.ok) { $('editNameErr').textContent = d.error || 'Ошибка'; return; }
      user.name = name;
      localStorage.setItem('user', JSON.stringify(user));
      $('editNameModal').classList.remove('on');
      renderProfile();
    });
};

function openEditUsername() {
  $('editUsernameInput').value = user.username || '';
  $('editUsernameErr').textContent = '';
  $('editUsernameModal').classList.add('on');
  $('editUsernameInput').focus();
}
$('editUsernameClose').onclick = function() { $('editUsernameModal').classList.remove('on'); };
$('editUsernameSave').onclick = function() {
  var username = $('editUsernameInput').value.trim().toLowerCase();
  if (!/^[a-z0-9_]{5,16}$/.test(username)) {
    $('editUsernameErr').textContent = '5–16, латиница, цифры, _';
    return;
  }
  fetch('/api/profile', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({ username: username })
  })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.ok) { $('editUsernameErr').textContent = d.error || 'Ошибка'; return; }
      user.username = username;
      localStorage.setItem('user', JSON.stringify(user));
      $('editUsernameModal').classList.remove('on');
      renderProfile();
    });
};

$('avatarInput').onchange = function() {
  var file = $('avatarInput').files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function() {
    fetch('/api/avatar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream', 'Authorization': 'Bearer ' + token },
      body: reader.result
    })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (!d.ok) { alert(d.error || 'Ошибка'); return; }
        user.avatar = d.avatar;
        localStorage.setItem('user', JSON.stringify(user));
        $('avatarInput').value = '';
        renderProfile();
      });
  };
  reader.readAsArrayBuffer(file);
};

// ===== КОНТАКТЫ =====
$('addContactClose').onclick = function() { $('addContactModal').classList.remove('on'); };
$('addContactBtn').onclick = function() {
  var q = $('addContactInput').value.trim().toLowerCase();
  var err = $('addContactErr');
  err.textContent = '';
  if (!q) { err.textContent = 'Введите юзернейм'; return; }
  fetch('/api/search?q=' + encodeURIComponent(q), {
    headers: { 'Authorization': 'Bearer ' + token }
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.users || !data.users.length) { err.textContent = 'Не найдено'; return; }
      var u = data.users[0];
      fetch('/api/contacts/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ userId: u.id })
      })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (!d.ok) { err.textContent = d.error || 'Ошибка'; return; }
          $('addContactModal').classList.remove('on');
          if (currentTab === 'contacts') renderContacts();
        });
    });
};

$('createBtn').onclick = function() {
  if (currentTab === 'contacts') {
    $('addContactInput').value = '';
    $('addContactErr').textContent = '';
    $('addContactModal').classList.add('on');
    $('addContactInput').focus();
  } else {
    alert('Создать — позже');
  }
};

// ===== СТАРТ =====
setTab('chats');
</script>
